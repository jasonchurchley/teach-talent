# Jobs admin (Decap CMS). Saves JSON into content/ in the GitHub repo; Netlify rebuilds the site on each publish.
# TODO at go-live: set repo + DecapBridge auth (see README "Jobs admin").
backend:
  name: github
  repo: jasonchurchley/teach-talent
  branch: main
local_backend: true          # only used when `npx decap-server` is running locally

site_url: https://www.teachtalent.co.uk
logo_url: /images/mark.png
media_folder: site/images/uploads
public_folder: /images/uploads

editor:
  preview: false

collections:
  - name: jobs
    label: Jobs
    label_singular: Job
    folder: content/jobs
    extension: json
    format: json
    create: true
    delete: true
    slug: "{{title}}-{{town}}"
    summary: "{{title}}, {{town}} (closes {{closes}})"
    sortable_fields: [posted, closes, title]
    description: "Each job gets its own page and appears in Google for Jobs. Jobs disappear from the site automatically after their closing date."
    fields:
      - {name: title, label: Job title, widget: string, hint: "e.g. SEN Teaching Assistant"}
      - {name: town, label: Town, widget: string}
      - {name: county, label: County, widget: select, options: [Cambridgeshire, Norfolk, Suffolk, Essex, Hertfordshire, Bedfordshire]}
      - {name: type, label: Contract, widget: select, options: [Day to day, Short term, Long term, Permanent]}
      - {name: employment, label: Hours, widget: select, default: FULL_TIME,
         options: [{label: Full time, value: FULL_TIME}, {label: Part time, value: PART_TIME}, {label: Temporary, value: TEMPORARY}]}
      - {name: pay, label: Pay (as shown on the site), widget: string, hint: "e.g. £95 to £105 per day"}
      - {name: pay_min, label: Pay from (number only), widget: number, value_type: float}
      - {name: pay_max, label: Pay to (number only), widget: number, value_type: float}
      - {name: pay_unit, label: Pay per, widget: select, default: DAY,
         options: [{label: Hour, value: HOUR}, {label: Day, value: DAY}, {label: Year, value: YEAR}]}
      - {name: start, label: Start, widget: string, hint: "e.g. January 2027 or ASAP"}
      - {name: posted, label: Date posted, widget: datetime, format: YYYY-MM-DD, date_format: DD/MM/YYYY, time_format: false}
      - {name: closes, label: Closing date, widget: datetime, format: YYYY-MM-DD, date_format: DD/MM/YYYY, time_format: false}
      - {name: summary, label: Short summary, widget: text, hint: "One or two sentences. Shown on the job list and in Google."}
      - {name: details, label: Key points, widget: list, field: {name: point, label: Point, widget: string}}
      - {name: draft, label: Hide from site, widget: boolean, default: false, required: false}

  - name: pages
    label: Page text
    files:
      - name: jobs-page
        label: Jobs page text
        file: content/jobs-page.json
        fields:
          - {name: heading, label: Heading, widget: string}
          - {name: intro, label: Intro, widget: text}
          - {name: empty_title, label: "When there are no jobs: title", widget: string}
          - {name: empty_text, label: "When there are no jobs: text", widget: text}
